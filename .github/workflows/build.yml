name: Build

# CI on every push/PR, and automatic binary publishing when a vX.Y.Z tag is pushed
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # Fast checks: formatting, clippy and a debug build
  # ---------------------------------------------------------------
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: System dependencies (GUI)
        run: |
          # egui/winit needs X11, Wayland and OpenGL. GTK is NOT required:
          # file dialogs go through the XDG Desktop Portal (rfd -> ashpd).
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check
        continue-on-error: true # informational: does not block the build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Build (debug)
        run: cargo build --verbose

  # ---------------------------------------------------------------
  # Release binaries for all three platforms
  # ---------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: todo-downloader-windows-x86_64.exe
            binary: target/x86_64-pc-windows-msvc/release/todo-downloader.exe

          - name: Linux x86_64
            os: ubuntu-22.04 # older glibc = wider compatibility
            target: x86_64-unknown-linux-gnu
            artifact: todo-downloader-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/todo-downloader

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: todo-downloader-macos-aarch64
            binary: target/aarch64-apple-darwin/release/todo-downloader

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: todo-downloader-macos-x86_64
            binary: target/x86_64-apple-darwin/release/todo-downloader

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: System dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          # egui/winit needs X11, Wayland and OpenGL. GTK is NOT required:
          # file dialogs go through the XDG Desktop Portal (rfd -> ashpd).
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build in release mode
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          cd dist
          # Checksum so anyone can verify their download
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Publish a release when a vX.Y.Z tag is pushed
  # ---------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body: |
            ## Todo Downloader ${{ github.ref_name }}

            Portable binaries, no installer. Grab the one for your system:

            | System | File |
            |---|---|
            | Windows 10/11 (64-bit) | `todo-downloader-windows-x86_64.exe` |
            | Linux (x86_64) | `todo-downloader-linux-x86_64` |
            | macOS Apple Silicon (M1/M2/M3…) | `todo-downloader-macos-aarch64` |
            | macOS Intel | `todo-downloader-macos-x86_64` |

            Each file ships with a `.sha256` so you can verify your download.

            **Linux/macOS**: make it executable with `chmod +x todo-downloader-*`.

            **Windows**: SmartScreen or your antivirus may warn about the binary
            because it is not code-signed. It is a reputation-based false
            positive — you can verify the hash and read the full source here.

            The engines (yt-dlp, gallery-dl, ffmpeg) install from inside the
            application with one click — no Python, no dependencies.
