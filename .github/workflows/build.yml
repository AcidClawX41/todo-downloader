name: Build

# CI en cada push/PR, y publicación automática de binarios al crear un tag vX.Y.Z
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # Comprobaciones rápidas: formato, clippy y compilación
  # ---------------------------------------------------------------
  check:
    name: Comprobar (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Dependencias de sistema (GUI)
        run: |
          # egui/winit necesita X11, Wayland y OpenGL. GTK NO hace falta:
          # los diálogos de archivo usan XDG Desktop Portal (rfd → ashpd).
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check
        continue-on-error: true # informativo: no bloquea la compilación

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Compilar (debug)
        run: cargo build --verbose

  # ---------------------------------------------------------------
  # Binarios de release para los tres sistemas
  # ---------------------------------------------------------------
  build:
    name: ${{ matrix.nombre }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artefacto: todo-downloader-windows-x86_64.exe
            binario: target/x86_64-pc-windows-msvc/release/todo-downloader.exe

          - nombre: Linux x86_64
            os: ubuntu-22.04 # glibc antigua = mayor compatibilidad
            target: x86_64-unknown-linux-gnu
            artefacto: todo-downloader-linux-x86_64
            binario: target/x86_64-unknown-linux-gnu/release/todo-downloader

          - nombre: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artefacto: todo-downloader-macos-aarch64
            binario: target/aarch64-apple-darwin/release/todo-downloader

          - nombre: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artefacto: todo-downloader-macos-x86_64
            binario: target/x86_64-apple-darwin/release/todo-downloader

    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # egui/eframe necesita GTK, X11/Wayland y OpenGL para compilar en Linux
      - name: Dependencias de sistema (solo Linux)
        if: runner.os == 'Linux'
        run: |
          # egui/winit necesita X11, Wayland y OpenGL. GTK NO hace falta:
          # los diálogos de archivo usan XDG Desktop Portal (rfd → ashpd).
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar en modo release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Preparar artefacto
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binario }}" "dist/${{ matrix.artefacto }}"
          cd dist
          # Checksum para que cualquiera pueda verificar la descarga
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artefacto }}" > "${{ matrix.artefacto }}.sha256"
          else
            shasum -a 256 "${{ matrix.artefacto }}" > "${{ matrix.artefacto }}.sha256"
          fi
          ls -lh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Publicar release cuando se empuja un tag vX.Y.Z
  # ---------------------------------------------------------------
  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los binarios
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Listar lo que se va a publicar
        run: ls -lh artifacts/

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body: |
            ## Todo Downloader ${{ github.ref_name }}

            Binarios portables, sin instalador. Descarga el de tu sistema:

            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 (64 bits) | `todo-downloader-windows-x86_64.exe` |
            | Linux (x86_64) | `todo-downloader-linux-x86_64` |
            | macOS Apple Silicon (M1/M2/M3…) | `todo-downloader-macos-aarch64` |
            | macOS Intel | `todo-downloader-macos-x86_64` |

            Cada archivo lleva su `.sha256` para verificar la descarga.

            **Linux/macOS**: dale permiso de ejecución con `chmod +x todo-downloader-*`.

            **Windows**: SmartScreen o tu antivirus pueden avisar porque el binario
            no está firmado digitalmente. Es un falso positivo por reputación;
            puedes verificar el hash y revisar el código fuente completo aquí.

            Los motores (yt-dlp, gallery-dl, ffmpeg) se instalan desde la propia
            aplicación con un clic — no hacen falta Python ni dependencias.
