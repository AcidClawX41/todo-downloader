name: Build

# CI on every push/PR, and automatic binary publishing when a vX.Y.Z tag is pushed
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # Fast checks: formatting, clippy and a debug build
  # ---------------------------------------------------------------
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: System dependencies (GUI)
        run: |
          # egui/winit needs X11, Wayland and OpenGL. GTK is NOT required:
          # file dialogs go through the XDG Desktop Portal (rfd -> ashpd).
          # libssl-dev: librqbit (BitTorrent) pulls in native-tls -> OpenSSL.
          # CON REINTENTOS Y CON TOPE. Los réplicas de Azure que usan los
          # runners fallan a ratos, y `apt-get` se queda esperando en vez de
          # rendirse: un run se pasó 1 h 43 min en este paso mientras los otros
          # cuatro jobs ya habían terminado. `timeout` corta, y tres intentos
          # bastan porque el fallo es transitorio.
          for i in 1 2 3; do
            timeout 300 sudo apt-get update && break
            echo "apt-get update falló (intento $i), reintentando…"
            sleep 10
          done
          for i in 1 2 3; do
            timeout 600 sudo apt-get install -y --no-install-recommends \
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
              libxkbcommon-dev libxkbcommon-x11-dev \
              libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
              libssl-dev pkg-config && break
            echo "apt-get install falló (intento $i), reintentando…"
            sleep 15
          done
          # Comprobación real: si pkg-config no ve x11, no seguimos a compilar
          # para fallar veinte minutos después con un error críptico del linker.
          pkg-config --exists x11 || { echo "::error::faltan las dependencias de X11"; exit 1; }

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check
        continue-on-error: true # informational: does not block the build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Unit tests
        run: cargo test --verbose

      - name: Build (debug)
        run: cargo build --verbose

  # ---------------------------------------------------------------
  # Release binaries for all three platforms
  # ---------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    # La compilación en release con LTO gorda es lenta a propósito, pero no
    # tanto. Un job que pase de esto está colgado, no trabajando.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: todo-downloader-windows-x86_64.exe
            binary: target/x86_64-pc-windows-msvc/release/todo-downloader.exe

          - name: Linux x86_64
            os: ubuntu-22.04 # older glibc = wider compatibility
            target: x86_64-unknown-linux-gnu
            artifact: todo-downloader-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/todo-downloader

          # Each macOS target builds on a runner of its OWN architecture.
          # Cross-compiling x86_64 from Apple Silicon does not work here:
          # librqbit pulls in native-tls -> OpenSSL, and the Homebrew OpenSSL
          # on an arm64 runner is arm64-only, so the link step fails.
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: todo-downloader-macos-aarch64
            binary: target/aarch64-apple-darwin/release/todo-downloader

          # macos-13 was retired in December 2025; macos-15-intel is the
          # current Intel label. GitHub drops x86_64 macOS after macOS 15 is
          # retired (Fall 2027), so this job has a known end of life.
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: todo-downloader-macos-x86_64
            binary: target/x86_64-apple-darwin/release/todo-downloader

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: System dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          # egui/winit needs X11, Wayland and OpenGL. GTK is NOT required:
          # file dialogs go through the XDG Desktop Portal (rfd -> ashpd).
          # libssl-dev: librqbit (BitTorrent) pulls in native-tls -> OpenSSL.
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev \
            libssl-dev pkg-config

      # macOS: point openssl-sys at the Homebrew OpenSSL that librqbit needs.
      # `brew --prefix` prints a path whether or not the formula is installed,
      # so the install has to be explicit: otherwise openssl-sys is handed a
      # directory that does not exist and the build fails at link time.
      - name: OpenSSL (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 || brew upgrade openssl@3 || true
          PREFIX="$(brew --prefix openssl@3)"
          test -d "$PREFIX/lib" || { echo "OpenSSL not found at $PREFIX"; exit 1; }
          echo "OPENSSL_DIR=$PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build in release mode
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          cd dist
          # Checksum so anyone can verify their download
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          ls -lh

      # ---------------------------------------------------------------
      # Windows installer
      # ---------------------------------------------------------------
      # The portable .exe remains the primary download; this is published
      # alongside it for people who expect a Setup. Windows only, and only
      # when building a tag: a Setup for an untagged commit has no version
      # worth putting in a filename.
      - name: Read version from Cargo.toml
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        id: ver
        shell: bash
        run: |
          # The single source of truth is Cargo.toml, the same place the
          # application reads its own version from at compile time.
          V=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"
          # A tag that disagrees with Cargo.toml means the bump was forgotten;
          # better to fail here than to publish a mislabelled installer.
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $V"
            exit 1
          fi

      # NON-BLOCKING on purpose. The portable executable is the primary
      # artifact and must ship even if the installer cannot be built: a
      # failure here would otherwise fail the Windows job, and the release
      # job needs every build to succeed. A broken installer step shows up
      # red in the run and gets fixed in a patch; a missing Windows binary
      # is a broken release.
      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        run: |
          # Inno Setup is not preinstalled on the runner image.
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} `
                  /DBinary=..\${{ matrix.binary }} `
                  installer\todo-downloader.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Add installer to the artifact set
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        run: |
          NAME="todo-downloader-setup-${{ steps.ver.outputs.version }}.exe"
          cd dist
          test -f "$NAME" || { echo "installer not found: $NAME"; ls -lh; exit 1; }
          sha256sum "$NAME" > "$NAME.sha256"
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Publish a release when a vX.Y.Z tag is pushed
  # ---------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts/

      # Attaches the binaries to the release for this tag.
      # No `body` and no `generate_release_notes` on purpose: if the release
      # was already written by hand, those would overwrite the notes.
      # If the release does not exist yet, the action creates it with the
      # tag name as title and an empty body.
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
