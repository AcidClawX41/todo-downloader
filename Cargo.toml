[package]
name = "todo-downloader"
version = "1.6.0"
build = "build.rs"
edition = "2021"
description = "Todo Downloader - Lightweight, bloat-free download manager (JDownloader2 alternative)"
authors = ["Eric V. Gramunt"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/AcidClawX41/todo-downloader"
keywords = ["downloader", "tiktok", "yt-dlp", "gallery-dl", "gui"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
eframe = { version = "0.28", features = ["persistence"] }
egui_extras = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
arboard = "3"
regex = "1"
open = "5"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Thumbnail decoding (video/image covers in the queue and preview grids)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Native BitTorrent client (magnet + .torrent): DHT, uTP, trackers, UPnP. Pure Rust, Apache-2.0.
librqbit = "8.1"
# Pure-Rust AES-128: the only primitive the MEGA engine needs. CTR mode, the
# attribute CBC and the chunked CBC-MAC are all built on top of the block
# cipher in src/mega/crypto.rs, to avoid pulling in crates used only in part.
aes = "0.8"

# Embeds the icon and version metadata into the Windows .exe
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
